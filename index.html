<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stigpass</title>
<meta name="description" content="Planera träningspass för cykelgruppen och dela dem med ledarna.">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1016" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stigpass">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/barlow-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: one-column phone app. Sticky top bar, content, fixed dock with block palette + three tabs.
   Signature: the Zwift-style intensity strip, where bar width = minutes and bar height = intensity. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#e3e8f0; --line:#d0d7e2;
  --fg:#0e131b; --muted:#566275; --accent:#e5530c; --accent-ink:#ffffff; --danger:#c8281c; --ok:#1e8a40;
  --t-samling:#77829a; --t-uppvarmning:#1d74d8; --t-teknik:#1e9444; --t-lek:#c99400; --t-stafett:#d02f7c;
  --t-intervall:#d3271b; --t-loop:#7f3bd6; --t-stationer:#0d958a; --t-avslutning:#4f5d78;
  --shadow:0 10px 30px rgba(14,19,27,.18); --int1:#1e8a40; --int2:#b88600; --int3:#d3271b;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1016; --surface:#151b25; --surface-2:#1d2531; --line:#283141;
    --fg:#edf1f7; --muted:#8d98ac; --accent:#ff6a21; --accent-ink:#1a0b02; --danger:#ff5246; --ok:#3ccf66;
    --t-samling:#8e99b0; --t-uppvarmning:#3f9cff; --t-teknik:#35c75d; --t-lek:#ffcb1f; --t-stafett:#ff4fa6;
    --t-intervall:#ff4a3d; --t-loop:#b469ff; --t-stationer:#2bd3c1; --t-avslutning:#7484a3;
    --shadow:0 12px 34px rgba(0,0,0,.5); --int1:#3ccf66; --int2:#ffcb1f; --int3:#ff4a3d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1016; --surface:#151b25; --surface-2:#1d2531; --line:#283141;
  --fg:#edf1f7; --muted:#8d98ac; --accent:#ff6a21; --accent-ink:#1a0b02; --danger:#ff5246; --ok:#3ccf66;
  --t-samling:#8e99b0; --t-uppvarmning:#3f9cff; --t-teknik:#35c75d; --t-lek:#ffcb1f; --t-stafett:#ff4fa6;
  --t-intervall:#ff4a3d; --t-loop:#b469ff; --t-stationer:#2bd3c1; --t-avslutning:#7484a3;
  --shadow:0 12px 34px rgba(0,0,0,.5); --int1:#3ccf66; --int2:#ffcb1f; --int3:#ff4a3d; color-scheme:dark;
}
/* The app's own sun/moon toggle wins over both the system and the viewer setting. */
:root[data-mode="light"]{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#e3e8f0; --line:#d0d7e2;
  --fg:#0e131b; --muted:#566275; --accent:#e5530c; --accent-ink:#ffffff; --danger:#c8281c; --ok:#1e8a40;
  --t-samling:#77829a; --t-uppvarmning:#1d74d8; --t-teknik:#1e9444; --t-lek:#c99400; --t-stafett:#d02f7c;
  --t-intervall:#d3271b; --t-loop:#7f3bd6; --t-stationer:#0d958a; --t-avslutning:#4f5d78;
  --shadow:0 10px 30px rgba(14,19,27,.18); --int1:#1e8a40; --int2:#b88600; --int3:#d3271b; color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#0c1016; --surface:#151b25; --surface-2:#1d2531; --line:#283141;
  --fg:#edf1f7; --muted:#8d98ac; --accent:#ff6a21; --accent-ink:#1a0b02; --danger:#ff5246; --ok:#3ccf66;
  --t-samling:#8e99b0; --t-uppvarmning:#3f9cff; --t-teknik:#35c75d; --t-lek:#ffcb1f; --t-stafett:#ff4fa6;
  --t-intervall:#ff4a3d; --t-loop:#b469ff; --t-stationer:#2bd3c1; --t-avslutning:#7484a3;
  --shadow:0 12px 34px rgba(0,0,0,.5); --int1:#3ccf66; --int2:#ffcb1f; --int3:#ff4a3d; color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
#app{max-width:720px;margin:0 auto;padding-block:0 96px}
#app.with-palette{padding-block:0 170px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  display:flex;align-items:center;gap:12px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.08em}
.brand-mark{display:flex;align-items:flex-end;gap:2px;height:20px}
.brand-mark i{display:block;width:5px;border-radius:1px}
.brand-mark i:nth-child(1){height:40%;background:var(--t-uppvarmning)}
.brand-mark i:nth-child(2){height:70%;background:var(--t-teknik)}
.brand-mark i:nth-child(3){height:100%;background:var(--accent)}
.brand-mark i:nth-child(4){height:55%;background:var(--t-lek)}
.spacer{flex:1}
.sync{font-size:13px;color:var(--muted)}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface)}
.icon-btn svg{width:22px;height:22px}
.banner{margin-block:4px 10px;padding:10px 12px;border-radius:var(--r);background:var(--surface-2);font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 40%, var(--line))}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5}
.btn svg{width:18px;height:18px}

.page-head{display:flex;align-items:center;gap:12px;margin-block:8px 16px}
.page-head h1{font-size:34px;flex:1;text-transform:uppercase;letter-spacing:.02em}
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.empty{padding:28px 18px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center;display:grid;gap:12px;justify-items:center}
.empty b{color:var(--fg);font-family:var(--font-display);font-size:22px}
.section-label{margin-block:22px 10px}

/* strip */
.strip{position:relative;display:flex;align-items:flex-end;width:100%;overflow:hidden}
.strip.mini{height:34px}
#ed-strip{overflow-x:clip}
.strip.big{width:calc(100% - 14px);height:112px;background:linear-gradient(to top, var(--line) 1px, transparent 1px) 0 0/100% 33.33%;border-bottom:2px solid var(--line);overflow:visible}
.seg{position:relative;flex:0 0 auto;height:100%;display:flex;align-items:flex-end;padding-right:2px;min-width:3px}
.seg .bar{width:100%;border-radius:3px 3px 0 0;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.seg .bar i{flex:1;background:inherit;filter:brightness(1.12)}
.seg .bar i:nth-child(even){filter:brightness(.85)}
.strip.big .seg{cursor:pointer}
.seg.sel .bar{outline:3px solid var(--fg);outline-offset:-1px}
.grip{position:absolute;right:-14px;top:0;bottom:0;width:28px;display:grid;place-items:center;touch-action:none;cursor:ew-resize;z-index:3}
.grip::before{content:"";width:10px;height:44px;border-radius:6px;background:var(--fg);box-shadow:0 0 0 3px var(--bg)}
.tip{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:var(--fg);color:var(--bg);
  font-family:var(--font-display);font-weight:700;font-size:16px;padding:2px 8px;border-radius:6px;white-space:nowrap;pointer-events:none}
.plan-mark{position:absolute;top:-6px;bottom:-2px;width:0;border-left:2px dashed var(--muted);pointer-events:none}
.plan-mark span{position:absolute;top:-18px;right:4px;font-size:11px;color:var(--muted);white-space:nowrap;font-weight:600}
.ticks{position:relative;height:20px;margin-right:14px;margin-top:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%)}
.ticks span:first-child{transform:none}

.t-samling{background:var(--t-samling)} .t-uppvarmning{background:var(--t-uppvarmning)} .t-teknik{background:var(--t-teknik)}
.t-lek{background:var(--t-lek)} .t-stafett{background:var(--t-stafett)} .t-intervall{background:var(--t-intervall)}
.t-loop{background:var(--t-loop)} .t-stationer{background:var(--t-stationer)} .t-avslutning{background:var(--t-avslutning)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:0 0 auto}

/* pass list */
.plist{display:grid;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;cursor:pointer}
.pcard-top{display:flex;gap:12px;align-items:flex-start}
.pcard h3{font-size:22px}
.pmeta{flex:1;min-width:0}
.pmeta p{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.pmin{text-align:right;font-family:var(--font-display);line-height:1}
.pmin b{font-size:30px;display:block}
.pmin span{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.pactions{display:flex;gap:8px;flex-wrap:wrap}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}

/* editor */
.ed-top{display:flex;align-items:center;gap:8px;margin-block:4px 10px}
.title-input{width:100%;border:0;background:transparent;font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1.1;padding:4px 0;
  border-bottom:2px solid transparent;border-radius:0}
.title-input:focus{outline:none;border-bottom-color:var(--accent)}
.when{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-block:6px}
.field{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
textarea.field{resize:vertical;min-height:80px}
.field:focus{outline:2px solid var(--accent);outline-offset:-1px}
.totalrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-block:18px 26px}
.tot-num{font-family:var(--font-display);line-height:.9;display:flex;align-items:baseline;gap:6px}
.tot-num b{font-size:56px;font-variant-numeric:tabular-nums}
.tot-num span{font-size:18px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.tot-sub{font-size:14px;color:var(--muted);text-align:right}
.tot-sub .ok{color:var(--ok);font-weight:600}
.tot-sub .over{color:var(--danger);font-weight:600}

.blist{display:grid;gap:8px;margin-top:18px}
.bwrap{position:relative;border-radius:var(--r);overflow:hidden}
.bdel{position:absolute;inset:0;display:flex;align-items:center;padding-left:18px;gap:8px;background:var(--danger);color:#fff;font-weight:700;border-radius:var(--r);opacity:0}
.bdel svg{width:20px;height:20px}
.bcard{touch-action:pan-y;position:relative;display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;cursor:pointer;min-height:68px}
.bcard.sel{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.bwrap.dragging{z-index:5;overflow:visible}
.bcard.dragging{z-index:5;box-shadow:var(--shadow);border-color:var(--accent);transition:none}
.handle{flex:0 0 40px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;border:0;background:transparent}
.handle svg{width:18px;height:18px}
.bstripe{flex:0 0 6px}
.bbody{flex:1;min-width:0;padding:10px 12px}
.bline{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bbody h4{font-size:20px;margin-top:2px}
.bdesc{font-size:14px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bextra{font-size:13px;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--fg)}
.bextra span{display:inline-flex;align-items:center;gap:4px}
.bmin{flex:0 0 auto;padding:10px 12px 10px 4px;text-align:right;font-family:var(--font-display);line-height:1}
.bmin b{font-size:28px;display:block;font-variant-numeric:tabular-nums}
.bmin span{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.thumb{flex:0 0 auto;width:64px;align-self:center;margin-right:10px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff}
.thumb img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.ipill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:999px;font-size:11px;letter-spacing:.06em;color:var(--fg);background:color-mix(in srgb, var(--ic) 20%, transparent)}
.ipill i{width:8px;height:8px;border-radius:50%;background:var(--ic)}
.i1{--ic:var(--int1)} .i2{--ic:var(--int2)} .i3{--ic:var(--int3)}
.seg3 button.iN{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg3 button.iN::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ic)}
.seg3 button.iN[aria-pressed="true"]{background:var(--ic);color:#fff}
.seg3 button.iN[aria-pressed="true"]::before{background:#fff}
.seg3 button.i2[aria-pressed="true"]{color:#1a1400}
.seg3 button.i2[aria-pressed="true"]::before{background:#1a1400}
.thumb canvas{display:block;width:100%;aspect-ratio:4/3}
.matpick{display:grid;gap:8px}
.mchip{display:inline-flex;align-items:center;gap:2px;min-height:36px;padding:0 4px 0 12px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:600}
.mchip button{min-width:32px;min-height:32px;border:0;background:transparent;color:inherit;font-size:18px;line-height:1;border-radius:50%}
.mchip b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.chip.add{color:var(--muted)}
.poi-ic{width:30px;height:30px;flex:0 0 30px}
.chip img{width:22px;height:22px;margin-left:-6px}
.hscroll-wrap{position:relative}
.palette,.hscroll{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent)}
.palette.end,.hscroll.end{-webkit-mask-image:none;mask-image:none}
.sat{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;text-decoration:none;font-size:14px}

.matcard{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.matlist{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.matlist li{background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.more{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.more summary{padding:14px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.more summary::after{content:"+";font-size:20px;line-height:1;color:var(--muted)}
.more[open] summary::after{content:"–"}
.more-body{padding:0 14px 14px;display:grid;gap:12px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.sk-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sk-prev{width:120px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff}
.sk-prev img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(0px, env(safe-area-inset-left,0px));padding-right:max(0px, env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.palette{display:flex;gap:8px;overflow-x:auto;padding:10px max(16px, env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);scrollbar-width:none}
.palette::-webkit-scrollbar{display:none}
.pal{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px}
.pal .sw{width:8px;height:24px;border-radius:2px}
.pal .plus{font-family:var(--font-display);font-size:20px;line-height:1;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);max-width:720px;margin:0 auto}
.tab{display:grid;justify-items:center;gap:2px;padding:8px 4px 10px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;min-height:56px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

/* drills */
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{padding-left:38px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters{display:grid;gap:4px;margin-bottom:12px}
.frow{display:flex;gap:8px;align-items:center}
.frow select{min-height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:14px;font-weight:600}
.dlist{display:grid;gap:8px}
.dcard{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer}

const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
function lev(a, b){
  const m = a.length, n = b.length; if (!m || !n) return m + n;
  let prev = Array.from({length:n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++){ const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));

function stdOf(name){
  const n = String(name || '').toLowerCase().replace(/\s+/g, ' ').trim(); if (!n) return null;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const tn = k => T[k]?.n || k || '';
const nf1 = new Intl.NumberFormat('sv-SE', {maximumFractionDigits:1});
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const total = p => (p.blocks || []).reduce((s, b) => s + (+b.min || 0), 0);
const slug = s => String(s || '').toLowerCase().replace(/[^a-z0-9åäö]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'pass';
const fmtDist = m => m < 1000 ? `${Math.round(m)} m` : `${nf1.format(m/1000)} km`;
function fmtDate(p){
  if (!p.date) return p.time ? `Kl ${p.time}` : 'Inget datum';
  const d = new Date(p.date + 'T12:00');
  let s = d.toLocaleDateString('sv-SE', {weekday:'long', day:'numeric', month:'short'});
  s = s.charAt(0).toUpperCase() + s.slice(1);
  return p.time ? `${s} kl ${p.time}` : s;

function blockTitle(b){ const n = tn(b.type); return b.title && b.title !== n ? b.title : n; }

/* material: "10 koner, 2 flaskor". Stations run at the same time, so their material adds up;
   blocks run one after another, so the pass needs the largest amount any single block uses. */
function parseMat(s){
  return String(s || '').split(/[,\n;]+/).map(x => x.trim()).filter(Boolean).map(x => {
    const m = x.match(/^(\d+)\s*(?:st\.?\s+)?(.+)$/i);
    const it = m ? {q:+m[1], n:m[2].trim(), raw:x} : {q:0, n:x, raw:x};
    const sd = stdOf(it.n);
    if (sd){ it.std = sd; it.k = sd.k; it.q = it.q || 1; } else it.k = it.n.toLowerCase();
    return it;

function splitMat(str){
  const std = {}, free = [];
  parseMat(str).forEach(it => { if (it.std) std[it.k] = (std[it.k] || 0) + it.q; else free.push(it.raw); });

const S = {
  tab:'pass', edit:null, dirty:false, saving:false, sel:null, lastPass:null,
  drills:{}, passes:{}, routes:{}, sketches:{},

/* ---------- storage ---------- */
function write(col, id, data){
  const doc = {...data}; delete doc.id;
  S[col] = {...S[col], [id]: {...doc, id}};
  if (!S.db) return Promise.resolve();
  try { S.db.collection(col).doc(id).set(doc).catch(writeErr); } catch (e){ writeErr(e); }
  return Promise.resolve();
}
function remove(col, id){
  const m = {...S[col]}; delete m[id]; S[col] = m;
  if (!S.db) return;
  try { S.db.collection(col).doc(id).delete().catch(writeErr); } catch (e){ writeErr(e); }
}
function writeErr(e){
  const name = String(e && (e.name || e.code) || '');
  if (name.includes('Quota')) toast('Telefonens lagring är full. Ta bort gamla pass eller skisser och försök igen.');
  else toast('Kunde inte spara. Försök igen.');
  console.warn(e);
}

function onData(col){
  if (col === 'passes' && S.edit){
    const sv = S.passes[S.edit.id];
    if (sv && !S.dirty && !S.saving && JSON.stringify(sv) !== JSON.stringify(S.edit)) S.edit = clone(sv);
  }
  if (col === 'routes') reapplyRoutePatch();
  if (isTyping()){ S.pendingRender = true; return; }
  render();
  if (S.sheet && (S.sheet.kind === 'pickDrill' || S.sheet.kind === 'pickPass') && col !== 'sketches') renderSheet();
}
function isTyping(){
  const a = document.activeElement;
  return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('#view').contains(a);
}
document.addEventListener('focusout', () => setTimeout(() => { if (S.pendingRender && !isTyping()) render(); }, 0));

let saveT;
function touchPass(rerender = true){

  S.dirty = true; S.edit.updated = Date.now();
  clearTimeout(saveT); saveT = setTimeout(flushPass, 600);

}

/* canvases */
function fitCanvas(cv){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  return {x, w, h};
}
function screenColors(){
  return {bg:tok('--surface'), grid:tok('--line'), casing:tok('--surface'), line:tok('--accent'), arrow:tok('--fg'), fg:tok('--fg'), muted:tok('--muted'), area:tok('--surface-2')};
}
function drawCanvases(){
  const c = screenColors();
  document.querySelectorAll('canvas[data-route]').forEach(cv => {
    const r = S.routes[cv.dataset.route]; if (!r) return;
    const {x, w, h} = fitCanvas(cv);
    drawRoute(x, r, w, h, {...c, bg:tok('--surface-2')}, {pad:8, lw:2.5, arrows:false, pois:false, scale:false, markR:4});
  });
  const rc = $('#route-canvas');
  if (rc && S.routeId && S.routes[S.routeId]){
    const {x, w, h} = fitCanvas(rc);
    S.routeProj = drawRoute(x, S.routes[S.routeId], w, h, c, {pad:30, lw:4, markR:11, poiR:15, sel:S.movePoi});
  }
  const ec = $('#ele-canvas');
  if (ec && S.routeId && S.routes[S.routeId]){
    const {x, w, h} = fitCanvas(ec);
    drawEle(x, S.routes[S.routeId], w, h, {...c, area:tok('--accent'), areaAlpha:.22});
  }
}
let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(drawCanvases, 120); });

/* ---------- sheet ---------- */
function openSheet(o){ S.sheet = o; renderSheet(); }
function closeSheet(){
  const k = S.sheet?.kind; S.sheet = null; renderSheet();
  if (k === 'block') flushPass();
}
function renderSheet(){
  const host = $('#sheet');
  if (!S.sheet){ host.hidden = true; host.innerHTML = ''; document.body.classList.remove('noscroll'); return; }
  const body = sheetBody();
  if (body == null){ S.sheet = null; return renderSheet(); }
  const prevScroll = host.querySelector('.sheet-body')?.scrollTop || 0;
  const same = host.dataset.kind === S.sheet.kind;
  host.dataset.kind = S.sheet.kind;
  host.hidden = false; document.body.classList.add('noscroll');
  host.innerHTML = `<div class="backdrop" data-act="closeSheet"></div><div class="sheet${same ? '' : ' anim'}" role="dialog" aria-modal="true"><div class="sheet-grab" data-drag="sheet"><span></span></div><div class="sheet-body">${body}</div></div>`;

}
function curBlock(){ return S.edit && S.sheet && (S.edit.blocks || []).find(b => b.id === S.sheet.id); }
function sheetBody(){

function buildText(p, wa){

  const pr = p.routeId && S.routes[p.routeId];

function wrapLines(x, text, maxW){

    const words = par.split(/\s+/).filter(Boolean); let cur = '';

    if (cur) out.push(cur);
  });
  return out;
}

  lines.forEach((l, i) => x.fillText(l, px, y + i * lh));

}

  if (o.t === 'pen'){ x.strokeStyle = o.c; x.lineWidth = 5; x.beginPath(); o.pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); if (o.pts.length === 1) x.lineTo(o.pts[0][0] + .1, o.pts[0][1]); x.stroke(); }

function skPos(e){ const cv = $('#sk-canvas'), r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 800, (e.clientY - r.top) / r.height * 600]; }

/* routes: edits are debounced; a pending patch survives incoming snapshots until it is written */
let routeT, RP = null;
function saveRoute(patch, rerender){
  const r = S.routes[S.routeId]; if (!r) return;
  if (RP && RP.id !== r.id) flushRoute();
  RP = {id:r.id, patch:{...(RP ? RP.patch : {}), ...patch}};
  S.routes = {...S.routes, [r.id]: {...r, ...patch}};
  clearTimeout(routeT); routeT = setTimeout(flushRoute, 600);
  if (rerender) render();
}
function flushRoute(){
  clearTimeout(routeT); if (!RP) return;
  const {id, patch} = RP; RP = null; const r = S.routes[id];
  if (r) write('routes', id, {...r, ...patch});
}
function reapplyRoutePatch(){ if (RP && S.routes[RP.id]) S.routes = {...S.routes, [RP.id]: {...S.routes[RP.id], ...RP.patch}}; }

let suppressClick = false;
document.addEventListener('click', e => {
  if (suppressClick){ suppressClick = false; e.preventDefault(); return; }
  if (e.target.closest('#sk')) return;
  if (e.target.id === 'route-canvas'){ routeTap(e); return; }
  const dragEl = e.target.closest('[data-drag]');
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (dragEl && el.contains(dragEl)) return;
  const fn = ACT[el.dataset.act]; if (fn){ e.preventDefault(); fn(el, e); }
});
/* Points can sit anywhere: on the route or beside it. Tap a point to pick it up, tap again to drop it. */
function routeTap(e){
  if (S.readOnly || !S.routeProj) return;
  const rt = S.routes[S.routeId]; if (!rt) return;
  const cv = e.target, rc = cv.getBoundingClientRect(), px = e.clientX - rc.left, py = e.clientY - rc.top;
  const pr = S.routeProj, ll = () => pr.inv(px, py).map(v => +v.toFixed(6));
  if (S.poiKind){
    const [lat, lon] = ll();
    const pois = [...(rt.pois || []), {lat, lon, kind:S.poiKind, note:''}];
    S.poiKind = null; saveRoute({pois}, true);
    requestAnimationFrame(() => { const inputs = document.querySelectorAll('[data-poi]'); inputs[inputs.length - 1]?.focus(); });
    return;
  }
  let hit = -1, hd = 26;
  (pr.poiXY || []).forEach((q, i) => { if (!q) return; const d = Math.hypot(q[0] - px, q[1] - py); if (d < hd){ hd = d; hit = i; } });
  if (S.movePoi != null){
    if (hit === S.movePoi){ S.movePoi = null; render(); return; }
    const [lat, lon] = ll(), pois = clone(rt.pois || []), pt = pois[S.movePoi];
    if (pt){ pt.lat = lat; pt.lon = lon; delete pt.i; }
    S.movePoi = null; saveRoute({pois}, true); toast('Punkten är flyttad'); return;
  }
  if (hit >= 0){ S.movePoi = hit; render(); }
}
document.addEventListener('input', e => {
  const t = e.target, v = t.value;
  if (t.dataset.bind && S.edit){
    const f = t.dataset.bind;
    S.edit[f] = f === 'planned' ? (v === '' ? 0 : Math.max(0, parseInt(v, 10) || 0)) : v;
    touchPass(f === 'planned' || f === 'routeId' || f === 'alt');
  } else if (t.dataset.bb){
    const b = curBlock(); if (!b) return; const f = t.dataset.bb;
    if (f === 'min'){ const n = parseInt(v, 10); if (!isNaN(n)) b.min = clamp(n, 1, 180); updateLaps(b); }
    else if (f === 'rest'){ const n = parseFloat(String(v).replace(',', '.')); if (!isNaN(n)) b.rest = clamp(n, 0, 10); updateLaps(b); }
    else if (f === 'rot'){ const n = parseInt(v, 10); if (!isNaN(n)) b.rot = clamp(n, 1, 60); }
    else b[f] = v;
    touchPass();
    if (f === 'routeId') renderSheet();
  } else if (t.dataset.matfree){
    let std = {}; try { std = JSON.parse(t.dataset.std || '{}'); } catch {}
    matSet(t.dataset.matfree, joinMat(std, v));
  } else if (t.dataset.st != null && t.dataset.i != null){
    const b = curBlock(); if (!b) return; b.stations[+t.dataset.i][t.dataset.st] = v; touchPass();
  } else if (t.dataset.dd && S.sheet?.draft){
    S.sheet.draft[t.dataset.dd] = t.dataset.dd === 'min' ? (parseInt(v, 10) || 0) : v;
  } else if (t.dataset.filter){
    if (t.dataset.filter === 'max') S.filter.max = +v || 0; else S.filter.q = v;
    const l = $('#drill-list'); if (l) l.innerHTML = drillListHTML();
  } else if (t.dataset.pq && S.sheet){
    S.sheet.q = v; const b = curBlock(); const sh = S.sheet;
    const onlyType = !sh.all && !sh.isNew && sh.station == null && b ? b.type : '';
    $('#pick-list').innerHTML = pickListHTML(filteredDrills({q:v}, onlyType));
  } else if (t.dataset.rb){
    const f = t.dataset.rb;
    if (f === 'tempo'){ const n = parseFloat(String(v).replace(',', '.')); if (n >= 3 && n <= 40){ saveRoute({tempo:n}); const o = $('#lap-out'); if (o) o.textContent = nf1.format(lapMin(S.routes[S.routeId])); } }
    else saveRoute({[f]: v});
  } else if (t.dataset.poi != null){
    const r = S.routes[S.routeId]; if (!r) return; const pois = clone(r.pois || []); pois[+t.dataset.poi].note = v; saveRoute({pois});
  }
});

/* drag: reorder blocks, resize from the strip, swipe sheet down */
document.addEventListener('pointerdown', e => {
  const card = e.target.closest('.bcard');
  if (card && !e.target.closest('[data-drag]') && !S.readOnly && S.edit && e.button === 0) startSwipe(card, e);
  const h = e.target.closest('[data-drag]'); if (!h || S.readOnly && h.dataset.drag !== 'sheet') return;
  if (h.dataset.drag === 'reorder') startReorder(h, e);
  else if (h.dataset.drag === 'resize') startResize(h, e);
  else if (h.dataset.drag === 'sheet') startSheetSwipe(h, e);
});
function track(e, move, up){
  const id = e.pointerId;
  const mv = ev => { if (ev.pointerId === id) move(ev); };
  const end = ev => { if (ev.pointerId !== id) return; window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end); up(ev); };
  window.addEventListener('pointermove', mv); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
}
function startReorder(h, e){
  e.preventDefault();
  const card = h.closest('.bwrap'), list = card.parentNode;
  try { h.setPointerCapture(e.pointerId); } catch {}
  const startY = e.clientY, startNat = card.getBoundingClientRect().top;
  let moved = false;
  card.classList.add('dragging'); card.querySelector('.bcard').classList.add('dragging');
  track(e, ev => {
    const y = ev.clientY; if (Math.abs(y - startY) > 4) moved = true;
    let changed = true;
    while (changed){
      changed = false;
      const next = card.nextElementSibling, prev = card.previousElementSibling;
      if (next && next.classList.contains('bwrap')){ const r = next.getBoundingClientRect(); if (y > r.top + r.height / 2){ list.insertBefore(next, card); changed = true; continue; } }
      if (prev && prev.classList.contains('bwrap')){ const r = prev.getBoundingClientRect(); if (y < r.top + r.height / 2){ card.after(prev); changed = true; } }
    }
    card.style.transform = ''; const nat = card.getBoundingClientRect().top;
    card.style.transform = `translateY(${startNat + (y - startY) - nat}px)`;
    if (y > innerHeight - 170) window.scrollBy(0, 10); else if (y < 90) window.scrollBy(0, -10);
  }, () => {
    card.classList.remove('dragging'); card.querySelector('.bcard')?.classList.remove('dragging'); card.style.transform = '';
    if (!moved) return;
    suppressClick = true; setTimeout(() => suppressClick = false, 350);
    const order = [...list.querySelectorAll('.bwrap')].map(c => c.dataset.id);
    const map = new Map(S.edit.blocks.map(b => [b.id, b]));
    S.edit.blocks = order.map(id => map.get(id)).filter(Boolean);
    touchPass();
  });
}
function startSwipe(card, e){
  const x0 = e.clientX, y0 = e.clientY, bg = card.parentNode.querySelector('.bdel');
  let mode = null, dx = 0;
  track(e, ev => {
    const mx = ev.clientX - x0, my = ev.clientY - y0;
    if (!mode){ if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my) * 1.3) mode = 'swipe'; else if (Math.abs(my) > 10) mode = 'scroll'; else return; }
    if (mode !== 'swipe') return;
    dx = Math.max(0, mx);
    card.classList.add('swiping'); card.style.transform = `translateX(${dx}px)`;
    if (bg) bg.style.opacity = Math.min(1, dx / 80);
  }, () => {
    if (mode !== 'swipe') return;
    suppressClick = true; setTimeout(() => suppressClick = false, 350);
    card.classList.remove('swiping');
    const w = card.getBoundingClientRect().width;
    if (dx > Math.min(130, w * .4)){
      card.classList.add('back'); card.style.transform = `translateX(${w}px)`;
      setTimeout(() => removeBlock(card.dataset.id), 180);
    } else {
      card.classList.add('back'); card.style.transform = ''; if (bg) bg.style.opacity = 0;
      setTimeout(() => card.classList.remove('back'), 220);
    }
  });
}
function removeBlock(id){
  if (!S.edit) return;
  const i = S.edit.blocks.findIndex(b => b.id === id); if (i < 0) return;
  const [b] = S.edit.blocks.splice(i, 1);
  const passId = S.edit.id;
  if (S.sel === id) S.sel = null;
  S.swipeHintSeen = true;
  touchPass();
  toast(`${blockTitle(b)} är borttaget`, 'Ångra', () => {
    if (!S.edit || S.edit.id !== passId) return;
    S.edit.blocks.splice(Math.min(i, S.edit.blocks.length), 0, b); S.sel = b.id; touchPass(); scrollToCard(b.id);
  });
}
function startResize(h, e){
  e.preventDefault(); e.stopPropagation();
  const seg = h.closest('.seg'), strip = seg.parentNode, b = S.edit.blocks.find(x => x.id === h.dataset.id); if (!b) return;
  try { h.setPointerCapture(e.pointerId); } catch {}
  const scale = Math.max(total(S.edit), +S.edit.planned || 0, 1), ppm = strip.getBoundingClientRect().width / scale;
  const start = +b.min || 1, x0 = e.clientX;
  let tip = document.createElement('span'); tip.className = 'tip'; tip.textContent = `${start} min`; seg.appendChild(tip);
  track(e, ev => {
    const nm = clamp(Math.round(start + (ev.clientX - x0) / ppm), 1, 180);
    if (nm === b.min) return;
    b.min = nm; seg.style.flexBasis = (nm / scale * 100) + '%'; tip.textContent = `${nm} min`;
    $('#ed-total').innerHTML = totalHTML(S.edit);
  }, () => { suppressClick = true; setTimeout(() => suppressClick = false, 350); touchPass(); });
}
function startSheetSwipe(h, e){
  const sheet = h.closest('.sheet'), y0 = e.clientY; let dy = 0;
  try { h.setPointerCapture(e.pointerId); } catch {}
  track(e, ev => { dy = Math.max(0, ev.clientY - y0); sheet.style.transform = `translateY(${dy}px)`; },
    () => { if (dy > 90) closeSheet(); else sheet.style.transform = ''; });
}
function updEnd(el){ if (el) el.classList.toggle('end', el.scrollLeft + el.clientWidth >= el.scrollWidth - 4); }
document.addEventListener('scroll', e => { const t = e.target; if (t && t.classList && (t.classList.contains('palette') || t.classList.contains('hscroll'))) updEnd(t); }, true);
document.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse') return;
  const el = e.target.closest('.palette, .hscroll'); if (!el) return;
  const x0 = e.clientX, s0 = el.scrollLeft; let moved = false;
  track(e, ev => { const dx = ev.clientX - x0; if (Math.abs(dx) > 5) moved = true; if (moved) el.scrollLeft = s0 - dx; },
    () => { if (moved){ suppressClick = true; setTimeout(() => suppressClick = false, 300); } });
});
document.addEventListener('wheel', e => {
  const el = e.target.closest && e.target.closest('.palette, .hscroll'); if (!el || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  el.scrollLeft += e.deltaY; e.preventDefault();
}, {passive:false});
window.addEventListener('resize', () => updEnd($('#palette')));
document.addEventListener('toggle', e => { if (e.target.id === 'p-more') S.moreOpen = e.target.open; }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (SK.open){ SK.open = false; renderSketch(); } else if (S.sheet) closeSheet(); }
});
window.addEventListener('pagehide', () => { flushPass(); flushRoute(); });
document.addEventListener('visibilitychange', () => { if (document.hidden){ flushPass(); flushRoute(); } });

applyMode();
/* ---------- Local storage: everything stays in this browser (IndexedDB) ---------- */
const COLS = ['drills','passes','routes','sketches'];
const LS_BACKUP = 'stigpass-lastbackup';
let IDB = null;

function idbOpen(){
  return new Promise((res, rej) => {
    let r; try { r = indexedDB.open('stigpass', 1); } catch (e){ rej(e); return; }
    r.onupgradeneeded = () => { const d = r.result; COLS.forEach(c => { if (!d.objectStoreNames.contains(c)) d.createObjectStore(c); }); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('blocked'));
  });
}
function idbReq(col, mode, fn){
  return new Promise((res, rej) => {
    const tx = IDB.transaction(col, mode), st = tx.objectStore(col), rq = fn(st);
    tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
function localAdapter(){
  return {
    collection(col){
      return {
        onSnapshot(next, err){
          const docs = [];
          const tx = IDB.transaction(col, 'readonly'), cur = tx.objectStore(col).openCursor();
          cur.onsuccess = () => { const c = cur.result; if (c){ const v = c.value, k = String(c.key); docs.push({id:k, data:() => v}); c.continue(); } };
          tx.oncomplete = () => next({docs});
          tx.onerror = () => err && err(tx.error);
          return () => {};
        },
        doc(id){
          return {
            set: data => idbReq(col, 'readwrite', st => st.put(JSON.parse(JSON.stringify(data)), id)),
            delete: () => idbReq(col, 'readwrite', st => st.delete(id))
          };
        }
      };
    }
  };
}
/* Fallback when the browser refuses storage (private mode): the app works, nothing is kept. */
const memAdapter = () => ({ collection: () => ({ onSnapshot(next){ setTimeout(() => next({docs:[]}), 0); return () => {}; }, doc: () => ({ set: async () => {}, delete: async () => {} }) }) });

async function bootLocal(){
  try { IDB = await idbOpen(); S.db = localAdapter(); }
  catch (e){ console.warn(e); S.db = memAdapter(); S.noStore = true; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  for (const col of COLS){
    S.db.collection(col).onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { m[d.id] = {...d.data(), id:d.id}; });
      S[col] = m; S.loaded[col] = true; onData(col);
    }, err => { console.warn(col, err); S.loaded[col] = true; render(); });
  }
  renderBanner(); render();
}
function lastBackup(){ try { return +localStorage.getItem(LS_BACKUP) || 0; } catch { return 0; } }
function backupDue(){
  const n = Object.keys(S.passes).length + Object.keys(S.drills).length;
  return n > 0 && Date.now() - lastBackup() > 30 * 864e5;
}
function fmtAgo(t){
  if (!t) return 'aldrig';
  const d = Math.floor((Date.now() - t) / 864e5);
  return d < 1 ? 'i dag' : d === 1 ? 'i går' : `för ${d} dagar sedan`;
}
function privacyHTML(){
  return `<header class="sh-head"><h2>Integritet</h2><button class="icon-btn" data-act="closeSheet" aria-label="Stäng">✕</button></header>
  <div class="prose">
  <p><b>Stigpass</b> är ett verktyg för att planera cykelträning.</p>
  <h3>Var datan finns</h3><p>Allt du lägger in, som pass, övningar, banor och skisser, sparas bara i den här enheten, i webbläsarens lagring. Inget skickas till någon server och ingen annan kan se det. Appen har ingen inloggning, spårning, statistik eller reklam.</p>
  <h3>Själva appen</h3><p>Appens filer hämtas från GitHub Pages. Som alla webbservrar ser GitHub din IP-adress när filerna laddas. Därefter fungerar appen även utan nät.</p>
  <h3>Det du delar</h3><p>Bilder och text som du delar i till exempel WhatsApp följer de appars villkor. Skriv inga uppgifter om barn, som namn eller hälsa, och använd inte bilder där personer går att känna igen.</p>
  <h3>Spara säkerhetskopior</h3><p>Rensar du webbplatsdata i webbläsaren, tar bort appen från hemskärmen eller byter telefon försvinner datan. Spara därför en säkerhetskopia ibland under Meny → Spara säkerhetskopia.</p>
  </div>`;
}
function accountHTML(){
  const n = {p:Object.keys(S.passes).length, d:Object.keys(S.drills).length, r:Object.keys(S.routes).length, s:Object.keys(S.sketches).length};
  return `<header class="sh-head"><h2>Meny</h2><button class="icon-btn" data-act="closeSheet" aria-label="Stäng">✕</button></header>
  <p>${n.p} pass · ${n.d} ${n.d === 1 ? 'övning' : 'övningar'} · ${n.r} ${n.r === 1 ? 'bana' : 'banor'} · ${n.s} ${n.s === 1 ? 'skiss' : 'skisser'}, sparade i den här enheten.</p>
  <p class="hint" style="margin:0">Senaste säkerhetskopia: ${fmtAgo(lastBackup())}</p>
  <div class="stack">
    <button class="btn primary" data-act="exportData">Spara säkerhetskopia</button>
    <label class="btn">Importera från fil<input type="file" id="import-in" accept=".json,application/json" hidden></label>
    <button class="btn" data-act="privacy">Om appen och integritet</button>
  </div>
  <details class="more" ${S.sheet.confirm === 'del' || S.sheet.busy ? 'open' : ''}><summary>Radera all data</summary><div class="more-body">
    <p>Allt i den här enheten tas bort: pass, övningar, banor och skisser. Spara gärna en säkerhetskopia först.</p>
    ${S.sheet.busy ? '<p class="hint">Raderar…</p>' : sh_confirm('del')
      ? `<span class="confirm">Är du säker? <button class="btn small danger" data-act="wipeData">Radera allt</button><button class="btn small" data-act="sheetConfirm" data-v="">Avbryt</button></span>`
      : `<button class="btn danger" data-act="sheetConfirm" data-v="del">Radera all data</button>`}
  </div></details>`;
}
Object.assign(ACT, {
  account(){ openSheet({kind:'account'}); },
  privacy(){ openSheet({kind:'privacy'}); },
  exportData(){
    flushPass(); flushRoute();
    const out = {app:'stigpass', version:1, exported:new Date().toISOString()};
    for (const col of COLS){ out[col] = {}; for (const [id, d] of Object.entries(S[col])){ const c = {...d}; delete c.id; out[col][id] = c; } }
    const blob = new Blob([JSON.stringify(out)], {type:'application/json'});
    try { localStorage.setItem(LS_BACKUP, String(Date.now())); } catch {}
    saveFile(`stigpass-sakerhetskopia-${today()}.json`, blob, true);
    if (S.sheet && S.sheet.kind === 'account') renderSheet();
    renderBanner();
  },
  async wipeData(){
    if (!S.sheet) return; S.sheet.busy = true; renderSheet();
    try {
      if (IDB) for (const col of COLS) await idbReq(col, 'readwrite', st => st.clear());
      for (const col of COLS) S[col] = {};
      S.edit = null; S.routeId = null;
      closeSheet(); render(); toast('All data är raderad');
    } catch (e){ console.warn(e); S.sheet.busy = false; renderSheet(); toast('Det gick inte att radera. Försök igen.'); }
  },
  shareText(){
    const txt = $('#share-text')?.value || '';
    if (navigator.share) navigator.share({text:txt}).catch(() => {});
  },
  async shareAll(){
    const imgs = S.sheet?.images || [];
    const files = imgs.map(im => new File([im.blob], im.file, {type:im.blob.type}));
    try { await navigator.share({files}); } catch (e){ if (!e || e.name !== 'AbortError') toast('Det gick inte att dela alla på en gång. Dela bilderna en och en.'); }
  },
  dlImg(el){ const im = S.sheet?.images?.[+el.dataset.i]; if (im) saveFile(im.file, im.blob, false); }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'import-in' || !e.target.files[0]) return;
  try {
    const data = JSON.parse(await e.target.files[0].text());
    if (!data || data.app !== 'stigpass'){ toast('Filen är ingen Stigpass-fil.'); return; }
    const n = {};
    for (const col of COLS){ n[col] = 0; for (const [id, d] of Object.entries(data[col] || {})){ if (d && typeof d === 'object'){ write(col, id, d); n[col]++; } } }
    closeSheet(); render();
    const pl = (k, one, many) => `${n[k]} ${n[k] === 1 ? one : many}`;
    toast(`Importerade ${pl('passes', 'pass', 'pass')}, ${pl('drills', 'övning', 'övningar')}, ${pl('routes', 'bana', 'banor')} och ${pl('sketches', 'skiss', 'skisser')}`);
  } catch (err){ console.warn(err); toast('Kunde inte läsa filen.'); }
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
bootLocal();

render();
